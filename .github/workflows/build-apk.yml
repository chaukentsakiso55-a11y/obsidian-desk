name: Build Obsidian Desk APK

on:
  push:
    branches: [main]
    paths:
      - "build/**"
      - "essentials/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout Obsidian Desk
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch DroidDesk Enhanced base
        run: |
          git clone --depth 1 --branch v1.0.1 https://github.com/techjarves/DroidDesk-Enhanced.git /tmp/obsidian-desk-upstream

      - name: Apply Linux compatibility fixes
        run: |
          python3 build/patch_upstream.py /tmp/obsidian-desk-upstream

      - name: Apply desktop compatibility fixes
        run: |
          python3 build/patch_mate.py /tmp/obsidian-desk-upstream

      - name: Apply Obsidian interface
        run: |
          python3 build/patch_obsidian.py /tmp/obsidian-desk-upstream

      - name: Apply public essentials and app catalog
        run: |
          python3 build/patch_obsidian_feed.py /tmp/obsidian-desk-upstream

      - name: Replace broken JetBrains Mono assets
        run: |
          set -euxo pipefail
          FONT_DIR="/tmp/obsidian-desk-upstream/app/assets/fonts"
          mkdir -p "$FONT_DIR"
          curl --fail --location --retry 3             "https://raw.githubusercontent.com/google/fonts/main/ofl/jetbrainsmono/JetBrainsMono%5Bwght%5D.ttf"             -o "$FONT_DIR/JetBrainsMono-Regular.ttf"
          cp "$FONT_DIR/JetBrainsMono-Regular.ttf" "$FONT_DIR/JetBrainsMono-Bold.ttf"
          test -s "$FONT_DIR/JetBrainsMono-Regular.ttf"
          test -s "$FONT_DIR/JetBrainsMono-Bold.ttf"

      - name: Install Flutter dependencies
        working-directory: /tmp/obsidian-desk-upstream/app
        run: flutter pub get

      - name: Static analysis
        working-directory: /tmp/obsidian-desk-upstream/app
        run: flutter analyze --no-fatal-warnings

      - name: Build release APK
        working-directory: /tmp/obsidian-desk-upstream/app
        run: flutter build apk --release

      - name: Verify APK
        run: |
          set -euxo pipefail
          APK="/tmp/obsidian-desk-upstream/app/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          unzip -tq "$APK"
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" Obsidian-Desk-v0.2.0.apk
          sha256sum Obsidian-Desk-v0.2.0.apk > Obsidian-Desk-v0.2.0.sha256

      - name: Publish APK
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add Obsidian-Desk-v0.2.0.apk Obsidian-Desk-v0.2.0.sha256
          git commit -m "Add Obsidian Desk v0.2.0 APK"
          git push origin HEAD:main
